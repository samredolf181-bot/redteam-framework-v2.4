<!doctype html>
<html><head><meta charset='utf-8'><title>RTF v6</title>
<script src='https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js'></script>
<script src='https://cdn.socket.io/4.7.5/socket.io.min.js'></script>
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
<style>body{background:#0b0f14;color:#d5dde5;font-family:Inter,system-ui}nav{padding:8px;background:#111827}main{padding:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{background:#1f2937;padding:12px;border-radius:8px}</style>
</head><body><nav>RTF OMEGA-BLACK v6.0</nav><main>
<div class='grid'><div class='card'>Workspaces</div><div class='card'>Findings</div><div class='card'>Pipelines</div><div class='card'>Agents</div></div>
<canvas id='c'></canvas><div id='map' style='height:300px'></div><svg id='g' width='800' height='300'></svg>
</main>
<script type='module'>
const ctx=document.getElementById('c');new Chart(ctx,{type:'line',data:{labels:['Mon','Tue','Wed'],datasets:[{label:'Findings',data:[3,8,5]}]}});
const map=L.map('map').setView([20,0],2);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
const svg=d3.select('#g');svg.selectAll('circle').data(d3.range(20)).enter().append('circle').attr('cx',()=>Math.random()*760+20).attr('cy',()=>Math.random()*260+20).attr('r',4).attr('fill','#60a5fa');
</script></body></html>
